<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif;height:100vh;display:grid;place-items:center}.card{width:min(520px,90vw);padding:42px;border:1px solid #163c45;border-radius:28px;background:#0c1118;text-align:center}.brand{color:#22d3ee;font-size:13px;letter-spacing:.22em;font-weight:700}h1{margin:14px 0 8px;font-size:30px}.sub{color:#71717a;font-size:14px;line-height:1.6}.code{width:100%;margin:28px 0 12px;height:72px;border:1px solid #26444b;border-radius:16px;background:#07090d;color:#fff;text-align:center;font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;outline:none}.code:focus{border-color:#22d3ee}.btn{width:100%;height:54px;border:0;border-radius:14px;background:#22d3ee;color:#041014;font-weight:700;font-size:15px;cursor:pointer}.btn:disabled{opacity:.5}.msg{min-height:22px;margin-top:16px;color:#fca5a5;font-size:13px}</style></head><body><div class="card"><div class="brand">DEN LED · PLAYER</div><h1>Cihazı eşleştir</h1><div class="sub">DEN LED Studio panelinde ekranınız için oluşturulan 6 karakterli kodu girin.</div><input id="code" class="code" maxlength="6" autocomplete="off" autofocus placeholder="ABC123"><button id="btn" class="btn">Cihazı Bağla</button><div id="msg" class="msg"></div></div><script>
const code=document.getElementById("code"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
async function pair(){const value=code.value.trim().toUpperCase();if(value.length!==6){msg.textContent="6 karakterli eşleştirme kodunu girin.";return}btn.disabled=true;btn.textContent="Bağlanıyor...";msg.textContent="";const result=await window.denLed.pair(value);if(!result.ok){msg.textContent=result.error||"Eşleştirme başarısız.";btn.disabled=false;btn.textContent="Cihazı Bağla";}}
btn.addEventListener("click",pair);code.addEventListener("keydown",e=>{if(e.key==="Enter")pair()});
</script></body></html>
