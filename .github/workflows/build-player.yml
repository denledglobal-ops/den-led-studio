name: Build DEN LED Player

on:
  workflow_dispatch:
  push:
    tags:
      - "player-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DEN-LED-Player-Windows
          path: player/dist/*.exe
      - name: Publish installer on tag
        if: startsWith(github.ref, 'refs/tags/player-v')
        uses: softprops/action-gh-release@v2
        with:
          files: player/dist/*.exe
